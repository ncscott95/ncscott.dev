<article>

  <div class="game-heading">
    <h3>{{ game.title }}</h3>
    <p class="game-jam">{{ game.jam }}</p>
  </div>

  <div>
    <a href="{{ game.link }}" target="_blank" class="thumbnail-link">
      <img class="thumbnail" src="{{ game.image | relative_url }}">
    </a>
    <p class="img-caption">
      {{ game.caption }}
    </p>
  </div>

  {{ game.content }}

</article>
