<ul>
  {% assign game_posts = site.posts 
    | where_exp: "post", "post.published == true" 
    | where_exp: "post", "post.categories contains page.game_category" 
  %}
  {% for post in game_posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a> — {{ post.date | date: "%B %d, %Y" }}
    </li>
  {% endfor %}
</ul>
